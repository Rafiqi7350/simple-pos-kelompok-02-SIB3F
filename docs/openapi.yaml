openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0

# ==============================================================================
# Catatan Perbandingan Pengujian API: Postman/Insomnia vs cURL
# ==============================================================================
# Pengujian ketiga endpoint Simple POS API menggunakan antarmuka grafis seperti
# Postman atau Insomnia menawarkan pengalaman pengembang (developer experience)
# yang jauh lebih unggul, efisien, dan ramah pengguna dibandingkan eksekusi
# perintah cURL di terminal. Melalui Graphical User Interface (GUI), pengisian
# parameter, header seperti Idempotency-Key, otentikasi Bearer Token, serta payload
# JSON dapat dilakukan secara visual tanpa hambatan escape karakter atau kerumitan
# sintaks command-line. Fitur visualisasi respons dengan format JSON yang
# terstruktur, rapi (pretty-print), dan dilengkapi penyorotan sintaks (syntax
# highlighting) beserta status kode HTTP berwarna sangat memudahkan inspeksi
# payload dan analisis data secara langsung. Ditambah lagi, kehadiran manajemen
# Environment Variables memfasilitasi otomatisasi alur kerja antar-endpoint—seperti
# penyimpanan otomatis token dari respons login ke dalam variabel global untuk
# langsung dikonsumsi oleh request produk dan transaksi—serta tersedianya tab riwayat
# (history) dan console logging yang menjadikan proses pelacakan kesalahan
# (debugging) jauh lebih cepat, terorganisir, dan minim risiko kesalahan manusia
# (human error).
# ==============================================================================

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/products:
    get:
      summary: Ambil daftar produk dengan paginasi
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Nomor halaman yang ingin diambil
          required: false
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Jumlah item per halaman
          required: false
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: Daftar produk berhasil diambil beserta metadata paginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 1 }
                        name: { type: string, example: "Kopi Susu" }
                        price: { type: integer, example: 15000 }
                        category: { type: string, example: "Minuman" }
                  links:
                    type: object
                    properties:
                      first: { type: string, example: "http://127.0.0.1:8000/api/v1/products?page=1" }
                      last: { type: string, example: "http://127.0.0.1:8000/api/v1/products?page=3" }
                      prev: { type: string, nullable: true, example: null }
                      next: { type: string, nullable: true, example: "http://127.0.0.1:8000/api/v1/products?page=2" }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer, example: 1 }
                      from: { type: integer, example: 1 }
                      last_page: { type: integer, example: 3 }
                      path: { type: string, example: "http://127.0.0.1:8000/api/v1/products" }
                      per_page: { type: integer, example: 10 }
                      to: { type: integer, example: 10 }
                      total: { type: integer, example: 25 }
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer